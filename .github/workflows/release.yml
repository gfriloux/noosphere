name: Release

# Triggered when the maintainer pushes a vX.Y.Z tag (the hybrid git policy: the agent never
# tags). Generates the release notes with git-cliff and creates the GitHub release.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # git-cliff needs the whole history, tags included

      - name: Release notes (git-cliff --latest)
        id: cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header

      - name: GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          body: ${{ steps.cliff.outputs.content }}
