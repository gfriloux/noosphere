name: CI

# Quality gates on push and PR. Calls `just ci-hermetic` inside the Nix dev shell — the same
# definition pre-commit and local development use; the Justfile is the authority.

on:
  push:
    branches: ["**"]
  pull_request:

# One run per ref: a later push cancels the runs it supersedes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: What this run does not check
        run: |
          echo "::notice title=QML not linted here::DankMaterialShell is not available on a"\
               "GitHub runner, and qmllint cannot resolve its qs.* modules without it, so the"\
               "QML lint does not run in CI. It runs locally and in pre-commit, where DMS is"\
               "installed — see PROCEDURE_PLANS.md section 4. A green run here proves"\
               "fmt-check, the manifest check and the tests, and nothing about QML."

      - name: just ci-hermetic (fmt-check + check-manifest + check-translations + test)
        run: nix develop --command just ci-hermetic
