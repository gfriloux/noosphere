name: CI

# Portes de qualité sur push et PR. Appelle `just ci` (fmt-check + lint + test) dans le
# dev shell Nix — même définition que pre-commit et le dev local (le Justfile fait foi).

on:
  push:
    branches: ["**"]
  pull_request:

# Un seul run par ref : les push successifs annulent les runs obsolètes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: What this run does not check
        run: |
          echo "::notice title=QML not linted here::DankMaterialShell is not available on a"\
               "GitHub runner, and qmllint cannot resolve its qs.* modules without it, so the"\
               "QML lint does not run in CI. It runs locally and in pre-commit, where DMS is"\
               "installed — see PROCEDURE_PLANS.md section 4. A green run here proves"\
               "fmt-check, the manifest check and the tests, and nothing about QML."

      - name: just ci-hermetic (fmt-check + check-manifest + test)
        run: nix develop --command just ci-hermetic
