---
# Local hooks. They call the Justfile's gates — one definition, several triggers. Install
# with `pre-commit install`.
#
# They are NOT the same set CI runs: CI calls `ci-hermetic`, which excludes `lint` because a
# runner has no DankMaterialShell. Pre-commit is therefore the only automatic QML gate, which
# is why its qmllint hook watches more than *.qml (see below).
repos:
  - repo: local
    hooks:
      - id: alejandra
        name: alejandra
        language: system
        entry: alejandra --check
        files: \.nix$
        pass_filenames: true
      - id: deadnix
        name: deadnix
        language: system
        entry: deadnix --fail
        files: \.nix$
        pass_filenames: true
      - id: qmlformat
        name: qmlformat
        language: system
        entry: just fmt-check
        files: \.qml$
        pass_filenames: false
      # Widened beyond *.qml on purpose. CI cannot run this gate (no DMS on a runner), so
      # pre-commit is the only automatic trigger — and lint resolution depends on more than
      # the QML: the flake pins Qt and Quickshell, and the Justfile and the import-path
      # script decide how they are found. Keyed on *.qml alone, a flake bump that removed a
      # type would land on main unlinted and surface later for whoever next touched a .qml.
      - id: qmllint
        name: qmllint
        language: system
        entry: just lint
        files: \.qml$|^flake\.(nix|lock)$|^Justfile$|^scripts/qml-import-paths$
        pass_filenames: false
      - id: check-manifest
        name: check-manifest
        language: system
        entry: just check-manifest
        files: ^plugin\.json$
        pass_filenames: false
      # Keyed on both sides of the pairing: the gate compares src/'s wrapped strings against
      # translations/, so a change to either can break it. Keyed on translations/ alone, a
      # renamed UI string would land untranslated.
      - id: check-translations
        name: check-translations
        language: system
        entry: just check-translations
        files: ^src/|^translations/
        pass_filenames: false
